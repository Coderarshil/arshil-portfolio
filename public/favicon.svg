<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- 
    BRUTAL SIMPLICITY FAVICON
    Built on a perfect 32x32 grid so it scales sharply down to 16x16.
  -->

  <!-- Main Document Shape -->
  <path 
    d="M 4 4 H 22 L 28 10 V 28 H 4 Z" 
    fill="#F2EBE3" 
    stroke="#7B4315" 
    stroke-width="4" 
    stroke-linejoin="round" 
  />
  
  <!-- Single, simplified Folded Corner -->
  <path 
    d="M 22 4 V 10 H 28 Z" 
    fill="#D9C3B0" 
    stroke="#7B4315" 
    stroke-width="4" 
    stroke-linejoin="round" 
  />
  
  <!-- Massive Central Cup (Solid block for high contrast at tiny sizes) -->
  <path 
    d="M 7 18 H 21 C 21 26, 7 26, 7 18 Z" 
    fill="#7B4315" 
  />
  
  <!-- Bold Cup Handle -->
  <path 
    d="M 21 19 C 24 19, 24 24, 21 24" 
    fill="none" 
    stroke="#7B4315" 
    stroke-width="3" 
    stroke-linecap="round" 
  />
  
  <!-- Two Thick Steam Waves (Spaced widely to prevent blending) -->
  <path 
    d="M 11 15 C 13 11, 8 9, 11 6" 
    fill="none" 
    stroke="#7B4315" 
    stroke-width="2" 
    stroke-linecap="round" 
  />
  <path 
    d="M 17 15 C 19 11, 14 9, 17 6" 
    fill="none" 
    stroke="#7B4315" 
    stroke-width="2" 
    stroke-linecap="round" 
  />
</svg>