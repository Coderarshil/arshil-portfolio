<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arshil — Folding Resume</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        :root {
            --paper-yellow: #f7e8a8;
            --paper-cream: #faf8f1;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 40%, #202126 0%, #0b0c0f 55%, #050608 100%);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: grab;
        }

        #canvas-container:active { cursor: grabbing; }

        #ui-container {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px;
            border: 1px solid rgba(60,38,22,.12);
            border-radius: 999px;
            background: rgba(255,252,247,.94);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,.18);
        }

        #ui-container button {
            width: 34px;
            height: 34px;
            padding: 0;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: #5b351d;
            font: 700 14px/1 Inter, system-ui, sans-serif;
            cursor: pointer;
            transition: transform .18s ease, background .18s ease, opacity .18s ease;
        }

        #ui-container button:hover:not(:disabled) {
            transform: translateY(-1px);
            background: rgba(139,69,19,.10);
        }

        #ui-container button:active:not(:disabled) { transform: scale(.94); }
        #ui-container button:disabled { opacity: .38; cursor: not-allowed; }

        #btn-fold {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: auto !important;
            min-width: 118px;
            padding: 10px 18px !important;
            border-radius: 999px !important;
            background: #8b4513 !important;
            color: #fff !important;
            box-shadow: 0 10px 28px rgba(139,69,19,.28);
            z-index: 21;
            font-size: 12px !important;
        }

        #btn-fold:hover:not(:disabled) {
            background: #6f3510 !important;
            transform: translateX(-50%) translateY(-1px) !important;
        }

        #btn-reset { display: none !important; }

        #hint {
            position: fixed;
            left: 50%;
            bottom: 62px;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255,255,255,.56);
            font-size: 11px;
            letter-spacing: .03em;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }

        #btn-close {
            font-size: 20px !important;
            margin-left: 2px;
        }

        @media (max-width: 600px) {
            #ui-container { top: 10px; right: 10px; }
            #ui-container button { width: 32px; height: 32px; }
            #hint { bottom: 60px; font-size: 10px; }
        }
    </style>
</head>

<body>
    <div id="hint">Drag to rotate 360°</div>

    <div id="ui-container" aria-label="Resume controls">
        <button id="btn-download" aria-label="Download resume" title="Download resume">⇩</button>
        <button id="btn-close" aria-label="Close" title="Close">×</button>
    </div>

    <button id="btn-fold" aria-label="Start folding animation">Wanna fly ✈</button>
    <button id="btn-reset" disabled>Reset</button>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const btnFold = document.getElementById('btn-fold');
        const btnReset = document.getElementById('btn-reset');
        const btnDownload = document.getElementById('btn-download');
        const btnClose = document.getElementById('btn-close');


        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x03040a);

        // Galaxy background: many tiny stars plus a smaller layer of brighter stars.
        const starGroup = new THREE.Group();
        scene.add(starGroup);

        function createStarfield() {
            const count = 1800;
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const radius = 9 + Math.random() * 22;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);

                positions[i * 3] =
                    radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.cos(phi);
                positions[i * 3 + 2] =
                    radius * Math.sin(phi) * Math.sin(theta);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute(
                'position',
                new THREE.BufferAttribute(positions, 3)
            );

            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.045,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.82,
                depthWrite: false
            });

            starGroup.add(new THREE.Points(geometry, material));

            const brightCount = 170;
            const brightPositions = new Float32Array(brightCount * 3);

            for (let i = 0; i < brightCount; i++) {
                const radius = 12 + Math.random() * 18;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);

                brightPositions[i * 3] =
                    radius * Math.sin(phi) * Math.cos(theta);
                brightPositions[i * 3 + 1] = radius * Math.cos(phi);
                brightPositions[i * 3 + 2] =
                    radius * Math.sin(phi) * Math.sin(theta);
            }

            const brightGeometry = new THREE.BufferGeometry();
            brightGeometry.setAttribute(
                'position',
                new THREE.BufferAttribute(brightPositions, 3)
            );

            const brightMaterial = new THREE.PointsMaterial({
                color: 0xfff8df,
                size: 0.075,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.9,
                depthWrite: false
            });

            starGroup.add(
                new THREE.Points(brightGeometry, brightMaterial)
            );
        }

        createStarfield();

        // Very subtle nebula haze.
        const nebulaCanvas = document.createElement('canvas');
        nebulaCanvas.width = 512;
        nebulaCanvas.height = 512;
        const nctx = nebulaCanvas.getContext('2d');
        const gradient = nctx.createRadialGradient(256, 256, 10, 256, 256, 250);
        gradient.addColorStop(0, 'rgba(92, 82, 170, 0.16)');
        gradient.addColorStop(0.42, 'rgba(44, 56, 120, 0.08)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        nctx.fillStyle = gradient;
        nctx.fillRect(0, 0, 512, 512);

        const nebulaTexture = new THREE.CanvasTexture(nebulaCanvas);
        const nebulaMaterial = new THREE.SpriteMaterial({
            map: nebulaTexture,
            transparent: true,
            depthWrite: false,
            opacity: 0.8
        });
        const nebulaSprite = new THREE.Sprite(nebulaMaterial);
        nebulaSprite.scale.set(18, 18, 1);
        nebulaSprite.position.set(0, 2, -12);
        scene.add(nebulaSprite);

        const camera = new THREE.PerspectiveCamera(
            35,
            window.innerWidth / window.innerHeight,
            0.1,
            100
        );
        camera.position.set(-2.0, -5.8, 7.2);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.045;

        // Continuous 360° horizontal rotation.
        controls.minAzimuthAngle = -Infinity;
        controls.maxAzimuthAngle = Infinity;

        // Allow almost a full vertical orbit without letting the camera
        // mathematically cross the pole, which is what causes the "stuck"
        // feeling in OrbitControls.
        controls.minPolarAngle = 0.04;
        controls.maxPolarAngle = Math.PI - 0.04;

        // Drag = rotate. Zoom is intentionally disabled in the 3D view.
        controls.enablePan = false;
        controls.screenSpacePanning = false;
        controls.rotateSpeed = 0.9;
        controls.zoomSpeed = 0.85;
        controls.enableZoom = false;

        controls.target.set(0, 0, 0);
        controls.minDistance = 3.4;
        controls.maxDistance = 13;

        btnDownload.addEventListener('click', () => {
            const a = document.createElement('a');
            a.href = window.location.href.split('#')[0];
            a.download = 'Arshil-Folding-Resume.html';
            document.body.appendChild(a);
            a.click();
            a.remove();
        });

        btnClose.addEventListener('click', () => {
            if (window.parent !== window) {
                window.parent.postMessage({ type: 'close-resume-modal' }, '*');
            } else {
                window.history.length > 1 ? window.history.back() : window.close();
            }
        });

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.78);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.35);
        dirLight.position.set(5, 10, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0xd6c7a9, 0.42);
        fillLight.position.set(-5, -4, -6);
        scene.add(fillLight);

        // The supplied resume is portrait A-ish proportions.
        // The model is scaled to match its visual aspect ratio closely.
        const W = 1.0;
        const H = 1.414;

        const Y_F0 = H - (W * 0.4142);
        const Y_F1 = H - W;
        const Y_F2 = H - (W * 2.4142);

        const vR = {
            TC:  [0, H, 0],
            TR:  [W, H, 0],
            F0R: [W, Y_F0, 0],
            F1R: [W, Y_F1, 0],
            F2R: [W, Y_F2, 0],
            BR:  [W, -H, 0],
            WR:  [0.2, -H, 0],
            BC:  [0, -H, 0]
        };

        const vL = {
            TC:  [0, H, 0],
            TL:  [-W, H, 0],
            F0L: [-W, Y_F0, 0],
            F1L: [-W, Y_F1, 0],
            F2L: [-W, Y_F2, 0],
            BL:  [-W, -H, 0],
            WL:  [-0.2, -H, 0],
            BC:  [0, -H, 0]
        };

        function createCrease(p1, p2) {
            const pivot = new THREE.Group();
            const hinge = new THREE.Group();
            pivot.add(hinge);

            pivot.position.fromArray(p1);

            const dx = p2[0] - p1[0];
            const dy = p2[1] - p1[1];
            pivot.rotation.z = Math.atan2(dy, dx) - Math.PI / 2;

            return { pivot, hinge };
        }

        const mainAssembly = new THREE.Group();
        scene.add(mainAssembly);

        mainAssembly.rotation.x = -0.5;
        mainAssembly.rotation.z = -0.2;

        const cCenterR = createCrease(vR.TC, vR.BC);
        const cWingR   = createCrease(vR.TC, vR.WR);
        const cF2R     = createCrease(vR.TC, vR.F2R);
        const cF1R     = createCrease(vR.TC, vR.F1R);
        const cF0R     = createCrease(vR.TC, vR.F0R);

        const cCenterL = createCrease(vL.TC, vL.BC);
        const cWingL   = createCrease(vL.TC, vL.WL);
        const cF2L     = createCrease(vL.TC, vL.F2L);
        const cF1L     = createCrease(vL.TC, vL.F1L);
        const cF0L     = createCrease(vL.TC, vL.F0L);

        mainAssembly.add(
            cCenterR.pivot, cWingR.pivot, cF2R.pivot, cF1R.pivot, cF0R.pivot,
            cCenterL.pivot, cWingL.pivot, cF2L.pivot, cF1L.pivot, cF0L.pivot
        );

        scene.updateMatrixWorld(true);

        cCenterR.hinge.attach(cWingR.pivot);
        cWingR.hinge.attach(cF2R.pivot);
        cF2R.hinge.attach(cF1R.pivot);
        cF1R.hinge.attach(cF0R.pivot);

        cCenterL.hinge.attach(cWingL.pivot);
        cWingL.hinge.attach(cF2L.pivot);
        cF2L.hinge.attach(cF1L.pivot);
        cF1L.hinge.attach(cF0L.pivot);

        // Source: the uploaded 2-page PDF. Page 1 is the resume and page 2 is the back artwork.
        // The PDF pages are rendered at high resolution for WebGL; the source PDF itself is unchanged. Both page textures are rotated 180° in the renderer so the supplied artwork appears upright on the physical sheet.
        // Front artwork: use the supplied resume exactly as provided.
        // No lighting/filter is applied to the image itself. The 180° texture rotation only compensates for the sheet/UV coordinate orientation.
        const resumeTexture = new THREE.TextureLoader().load(

        );
        backTexture.encoding = THREE.sRGBEncoding;
        backTexture.center.set(0.5, 0.5);
        backTexture.rotation = Math.PI;
        backTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        backTexture.wrapS = THREE.ClampToEdgeWrapping;
        backTexture.wrapT = THREE.ClampToEdgeWrapping;
        backTexture.minFilter = THREE.LinearMipmapLinearFilter;
        backTexture.magFilter = THREE.LinearFilter;

        const matYellow = new THREE.MeshBasicMaterial({
            map: backTexture,
            // Back artwork belongs ONLY to the reverse face.
            side: THREE.BackSide,
            transparent: false,
            depthWrite: true,
            polygonOffset: true,
            polygonOffsetFactor: -1,
            polygonOffsetUnits: -1
        });

        function createPanel(pts) {
            // Every panel must have the same winding direction. Some of the
            // folding panels are defined in the opposite order; without
            // normalizing them, FrontSide/BackSide can swap on those panels
            // and the resume artwork leaks onto the reverse during folding.
            let area = 0;
            for (let i = 0; i < pts.length; i++) {
                const a = pts[i];
                const b = pts[(i + 1) % pts.length];
                area += a[0] * b[1] - b[0] * a[1];
            }

            const orderedPts = area < 0 ? [...pts].reverse() : pts;

            const shape = new THREE.Shape();
            shape.moveTo(orderedPts[0][0], orderedPts[0][1]);

            for (let i = 1; i < orderedPts.length; i++) {
                shape.lineTo(orderedPts[i][0], orderedPts[i][1]);
            }

            shape.lineTo(orderedPts[0][0], orderedPts[0][1]);

            const geom = new THREE.ShapeGeometry(shape);

            // ShapeGeometry creates local UVs for each panel. Replace them
            // with page-global UVs so the resume remains one continuous sheet.
            const pos = geom.attributes.position;
            const uv = geom.attributes.uv;

            for (let i = 0; i < pos.count; i++) {
                const x = pos.getX(i);
                const y = pos.getY(i);

                const u = (x + W) / (2 * W);
                const v = (H - y) / (2 * H);

                uv.setXY(i, u, v);
            }

            uv.needsUpdate = true;

            const group = new THREE.Group();

            const front = new THREE.Mesh(geom, matResume);
            front.position.z = 0.012;
            front.castShadow = true;
            front.receiveShadow = true;

            const back = new THREE.Mesh(geom, matYellow);
            back.position.z = -0.012;
            back.castShadow = true;
            back.receiveShadow = true;

            group.add(front, back);
            return group;
        }
const P_S4_R = createPanel([vR.TC, vR.TR, vR.F0R]);
        const P_S3_R = createPanel([vR.TC, vR.F0R, vR.F1R]);
        const P_S2_R = createPanel([vR.TC, vR.F1R, vR.F2R]);
        const P_S1_R = createPanel([vR.TC, vR.F2R, vR.BR, vR.WR]);
        const P_Spine_R = createPanel([vR.TC, vR.WR, vR.BC]);

        const P_S4_L = createPanel([vL.TC, vL.TL, vL.F0L].reverse());
        const P_S3_L = createPanel([vL.TC, vL.F0L, vL.F1L].reverse());
        const P_S2_L = createPanel([vL.TC, vL.F1L, vL.F2L].reverse());
        const P_S1_L = createPanel([vL.TC, vL.F2L, vL.BL, vL.WL].reverse());
        const P_Spine_L = createPanel([vL.TC, vL.WL, vL.BC].reverse());

        mainAssembly.add(
            P_S4_R, P_S3_R, P_S2_R, P_S1_R, P_Spine_R,
            P_S4_L, P_S3_L, P_S2_L, P_S1_L, P_Spine_L
        );
scene.updateMatrixWorld(true);

        cF0R.hinge.attach(P_S4_R);
        cF1R.hinge.attach(P_S3_R);
        cF2R.hinge.attach(P_S2_R);
        cWingR.hinge.attach(P_S1_R);
        cCenterR.hinge.attach(P_Spine_R);

        cF0L.hinge.attach(P_S4_L);
        cF1L.hinge.attach(P_S3_L);
        cF2L.hinge.attach(P_S2_L);
        cWingL.hinge.attach(P_S1_L);
        cCenterL.hinge.attach(P_Spine_L);

        const deg = Math.PI / 180;

        const F1R_ANG =  180 * deg;
        const F1L_ANG = -180 * deg;

        const F2R_ANG =  180 * deg;
        const F2L_ANG = -180 * deg;

        const F0R_ANG = -180 * deg;
        const F0L_ANG =  180 * deg;

        const CTR_ANG = -88 * deg;
        const CTL_ANG =  88 * deg;

        const WGR_ANG =  90 * deg;
        const WGL_ANG = -90 * deg;

        let animationRunning = false;

        btnFold.addEventListener('click', () => {
            if (animationRunning) return;

            animationRunning = true;
            btnFold.disabled = true;
            btnReset.disabled = true;

            const tl = gsap.timeline({
                onComplete: () => {
                    animationRunning = false;
                    btnReset.disabled = false;
                }
            });

            tl.to(
                mainAssembly.rotation,
                { x: -0.8, z: 0.6, y: 0.5, duration: 10, ease: "power1.inOut" },
                0
            );

            // Step 1: fold top corners
            tl.to(cF1R.hinge.rotation, { y: F1R_ANG, duration: 2, ease: "power2.inOut" }, 0.5);
            tl.to(cF1L.hinge.rotation, { y: F1L_ANG, duration: 2, ease: "power2.inOut" }, 0.5);

            // Step 2: sharpening fold + hidden tuck
            tl.to(cF2R.hinge.rotation, { y: F2R_ANG, duration: 2, ease: "power2.inOut" }, 2.5);
            tl.to(cF2L.hinge.rotation, { y: F2L_ANG, duration: 2, ease: "power2.inOut" }, 2.5);

            tl.to(cF0R.hinge.rotation, { y: F0R_ANG, duration: 2, ease: "power2.inOut" }, 2.5);
            tl.to(cF0L.hinge.rotation, { y: F0L_ANG, duration: 2, ease: "power2.inOut" }, 2.5);

            // Step 3: center fold
            tl.to(cCenterR.hinge.rotation, { y: CTR_ANG, duration: 2, ease: "power2.inOut" }, 4.5);
            tl.to(cCenterL.hinge.rotation, { y: CTL_ANG, duration: 2, ease: "power2.inOut" }, 4.5);

            // Step 4: wings
            tl.to(cWingR.hinge.rotation, { y: WGR_ANG, duration: 2, ease: "power2.inOut" }, 6.5);
            tl.to(cWingL.hinge.rotation, { y: WGL_ANG, duration: 2, ease: "power2.inOut" }, 6.5);

            tl.to(
                mainAssembly.rotation,
                { x: -0.1, y: Math.PI / 4, z: 0.1, duration: 2.5, ease: "power2.out" },
                8.0
            );
        });

        btnReset.addEventListener('click', () => {
            if (animationRunning) return;

            animationRunning = true;
            btnFold.disabled = true;
            btnReset.disabled = true;

            const hinges = [
                cF0R.hinge, cF0L.hinge,
                cF1R.hinge, cF1L.hinge,
                cF2R.hinge, cF2L.hinge,
                cCenterR.hinge, cCenterL.hinge,
                cWingR.hinge, cWingL.hinge
            ];

            const tl = gsap.timeline({
                onComplete: () => {
                    animationRunning = false;
                    btnFold.disabled = false;
                }
            });

            hinges.forEach(hinge => {
                tl.to(
                    hinge.rotation,
                    { y: 0, duration: 1.7, ease: "power2.inOut" },
                    0
                );
            });

            tl.to(
                mainAssembly.rotation,
                { x: -0.5, y: 0, z: -0.2, duration: 2.0, ease: "power2.inOut" },
                0
            );
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            starGroup.rotation.y += 0.00012;
            starGroup.rotation.x += 0.000025;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
